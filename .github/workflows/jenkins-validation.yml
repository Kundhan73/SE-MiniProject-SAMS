name: Jenkins and SonarQube validation
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: jenkins-${{ github.ref }}
  cancel-in-progress: true
jobs:
  jenkins:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Execute Jenkins pipeline and SonarQube quality gate
        run: bash scripts/ci/run_jenkins_validation.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jenkins-sonarqube-evidence
          path: evidence/jenkins/
          retention-days: 30
