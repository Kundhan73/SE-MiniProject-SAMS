name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sams
          POSTGRES_USER: sams
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sams"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: ${{ matrix.database == 'postgres' && '127.0.0.1' || '' }}
      POSTGRES_DB: sams
      POSTGRES_USER: sams
      POSTGRES_PASSWORD: ci-only-password
      CELERY_TASK_ALWAYS_EAGER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: python manage.py check && python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: pytest --cov --cov-report=term-missing --cov-report=xml:docs/reports/coverage.xml --cov-report=html:htmlcov --junitxml=docs/reports/junit.xml
      - run: python scripts/test_reports.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ matrix.database }}
          path: |
            docs/reports/
            htmlcov/
  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - run: pip-audit --format json --output docs/reports/dependency-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit
          path: docs/reports/dependency-audit.json
  container:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sams:ci .
      - name: Migrate, seed and serve the built image
        run: |
          docker run -d --name sams -p 8000:8000 sams:ci sh -c 'python manage.py migrate --noinput && python manage.py seed_demo && gunicorn sams.wsgi:application --bind 0.0.0.0:8000'
          for i in $(seq 1 40); do
            if curl --fail http://127.0.0.1:8000/api/health/; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8000/api/health/
          curl --fail http://127.0.0.1:8000/login/ | grep 'Welcome back'
      - run: docker logs sams
        if: always()
  browser:
    name: Browser workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - run: playwright install --with-deps chromium
      - run: python manage.py migrate --noinput && python manage.py seed_demo
      - name: Run real browser flows
        run: |
          python manage.py runserver 127.0.0.1:8000 --noreload > /tmp/sams.log 2>&1 &
          python scripts/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: docs/reports/browser-*
  performance:
    name: Target-scale load test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sams
          POSTGRES_USER: sams
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sams"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_DB: sams
      POSTGRES_USER: sams
      POSTGRES_PASSWORD: ci-only-password
      CELERY_TASK_ALWAYS_EAGER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - run: python manage.py migrate --noinput && python manage.py seed_demo --full
      - name: Exercise full target dataset with concurrent faculty
        run: |
          gunicorn sams.wsgi:application --bind 127.0.0.1:8000 --workers 2 > /tmp/sams-load.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8000/api/health/; then break; fi
            sleep 1
          done
          locust -f scripts/locustfile.py --headless --host http://127.0.0.1:8000 -u 20 -r 5 -t 40s --csv docs/reports/load --html docs/reports/load.html
          python scripts/check_performance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-evidence
          path: |
            docs/reports/load*
            docs/reports/performance.json

  required:
    name: Required checks
    runs-on: ubuntu-latest
    needs: [test, security, container, browser, performance]
    if: always()
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}
