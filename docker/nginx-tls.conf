# Swagger loads vendor assets and an external same-origin initializer.
# $uri excludes query strings, so the same policy covers ?script=.
map $uri $sams_csp {
    default "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self'";
    /api/docs/ "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self'; form-action 'self'";
}
# Replace localhost with the staging domain; mount a valid certificate and key.
server {
    listen 80;
    server_tokens off;
    server_name localhost;
    return 301 https://$host:8443$request_uri;
}
server {
    listen 443 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    server_tokens off;
    proxy_hide_header X-Content-Type-Options;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy $sams_csp always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    location /static/ { alias /app/staticfiles/; }
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
