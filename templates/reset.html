{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password · SAMS</title><link rel="stylesheet" href="{% static 'app.css' %}"></head><body class="auth"><main class="reset-card"><a class="wordmark" href="/">SAMS<span>●</span></a><h1>Reset password</h1><p class="muted">{% if token %}Choose a new password of at least 10 characters.{% else %}Enter your registered email to receive a reset link.{% endif %}</p><form id="reset-form">{% csrf_token %}{% if token %}<input type="hidden" name="token" value="{{ token }}"><label for="new_password">New password</label><input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="10" required>{% else %}<label for="email">Email</label><input id="email" type="email" name="email" autocomplete="email" required>{% endif %}<button class="primary">{% if token %}Update password{% else %}Send reset link{% endif %}</button></form><p id="result" role="status"></p><a href="/login/">Back to sign in</a></main><script src="{% static 'reset.js' %}" defer></script></body></html>
