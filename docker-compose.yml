x-app: &app
  build: .
  env_file: .env
  environment:
    POSTGRES_HOST: db
    REDIS_URL: redis://redis:6379/0
    CELERY_TASK_ALWAYS_EAGER: '0'
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - staticfiles:/app/staticfiles
services:
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 15
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 15
  migrate:
    <<: *app
    command: sh -c 'python manage.py migrate --noinput && python manage.py collectstatic --noinput'
  web:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://localhost:8000/api/health/")']
      interval: 10s
      timeout: 5s
      retries: 12
  worker:
    <<: *app
    command: celery -A sams worker --loglevel=info
    depends_on:
      migrate:
        condition: service_completed_successfully
  beat:
    <<: *app
    command: celery -A sams beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    depends_on:
      migrate:
        condition: service_completed_successfully
  nginx:
    image: nginx:1.28-alpine
    ports: ['127.0.0.1:8000:80']
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/app/staticfiles:ro
    depends_on:
      web:
        condition: service_healthy
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['127.0.0.1:8025:8025']
volumes:
  postgres_data:
  staticfiles:
