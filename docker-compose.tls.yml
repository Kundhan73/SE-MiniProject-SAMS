services:
  nginx:
    ports: !override ['127.0.0.1:8000:80','127.0.0.1:8443:443']
    volumes:
      - ./docker/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
  web:
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; r=urllib.request.Request("http://localhost:8000/api/health/",headers={"X-Forwarded-Proto":"https"}); urllib.request.urlopen(r)']
